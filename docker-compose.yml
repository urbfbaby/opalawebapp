services:
  opala-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opala-property-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.production
    volumes:
      - ./public/images:/app/public/images
      - ./content:/app/content
