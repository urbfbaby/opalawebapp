# Nginx Server Block untuk Opala WebApp (Domain Terpisah pada Server EC2 yang Sama)
# Salin ke: /etc/nginx/sites-available/opala-webapp.conf
# Lalu aktifkan: sudo ln -s /etc/nginx/sites-available/opala-webapp.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    
    # Ganti dengan domain yang akan digunakan untuk katalog apartemen Opala
    server_name opala.com.au www.opala.com.au;

    # Forward traffic ke PM2 Opala WebApp di port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Optimasi cache untuk aset statis Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Izinkan upload gambar hingga 50MB
    client_max_body_size 50M;
}
