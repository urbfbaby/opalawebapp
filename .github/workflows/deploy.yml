name: Deploy Opala WebApp to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2 via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="$HOME/opalawebapp"

            echo "=== 1. Checking Application Directory ==="
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory $APP_DIR does not exist. Cloning repository..."
              git clone https://github.com/urbfbaby/opalawebapp.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "=== 2. Pulling Latest Code ==="
            git fetch --all
            git reset --hard origin/main

            echo "=== 3. Installing Dependencies ==="
            npm install --production=false

            echo "=== 4. Building Next.js Application ==="
            npm run build

            echo "=== 5. Restarting Application via PM2 ==="
            if pm2 list | grep -q "opala-webapp"; then
              pm2 restart opala-webapp --update-env
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save

            echo "=== Deployment Completed Successfully! ==="
